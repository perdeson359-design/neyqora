name: Generate Project

on:
  workflow_dispatch:
    inputs:
      request:
        description: "Describe the project to generate"
        required: true
        type: string
  issues:
    types: [opened]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate project from NEYQORA
        env:
          NEYQORA_URL: https://neyqora.kosseofficial.workers.dev
          PROJECT_REQUEST: ${{ github.event_name == 'issues' && github.event.issue.title || inputs.request }}
          ISSUE_BODY: ${{ github.event_name == 'issues' && github.event.issue.body || '' }}
          ISSUE_AUTHOR: ${{ github.event_name == 'issues' && github.event.issue.user.login || '' }}
        run: |
          set -e
          if [ "${{ github.event_name }}" = "issues" ]; then
            if [ "$ISSUE_AUTHOR" != "perdeson359-design" ]; then
              echo "Ignoring issue from non-owner."
              exit 0
            fi
            PROJECT_REQUEST="$PROJECT_REQUEST

$ISSUE_BODY"
          fi
          mkdir -p requests/generated

          python - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          url = os.environ["NEYQORA_URL"] + "/api/project"
          body = json.dumps({"request": os.environ["PROJECT_REQUEST"]}).encode()
          req = Request(url, data=body, headers={"content-type": "application/json"}, method="POST")

          with urlopen(req, timeout=120) as response:
              data = json.load(response)

          if not data.get("ok"):
              raise SystemExit("NEYQORA project generation failed: " + str(data))

          with open("/tmp/project.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False)
          PY

          python - <<'PY'
          import json
          import os
          import pathlib

          data = json.load(open("/tmp/project.json", encoding="utf-8"))
          request = os.environ["PROJECT_REQUEST"]
          safe_name = "".join(c.lower() if c.isalnum() else "-" for c in request).strip("-")[:40] or "project"
          root = pathlib.Path("projects") / safe_name
          root.mkdir(parents=True, exist_ok=True)

          for item in data["files"]:
              path = pathlib.Path(item["path"])
              if path.is_absolute() or ".." in path.parts:
                  raise SystemExit("Unsafe generated path: " + str(path))
              target = root / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(item["content"], encoding="utf-8")

          print("Generated project:", root)
          PY

      - name: Run generated Python tests
        shell: bash
        run: |
          set -e
          test_files=$(find projects -type f -name 'test_*.py' | sort)
          if [ -z "$test_files" ]; then
            echo "No Python tests were generated."
          else
            while IFS= read -r test_file; do
              echo "Testing $test_file"
              python "$test_file"
            done <<< "$test_files"
          fi

      - name: Validate generated Python syntax
        shell: bash
        run: |
          set -e
          python_files=$(find projects -type f -name '*.py' | sort)
          if [ -z "$python_files" ]; then
            echo "No Python files found."
            exit 0
          fi
          while IFS= read -r python_file; do
            echo "Compiling $python_file"
            python -m py_compile "$python_file"
          done <<< "$python_files"

      - name: Commit generated project
        run: |
          git config user.name "NEYQORA"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/
          git diff --cached --quiet && echo "No changes to commit." && exit 0
          git commit -m "Generate and test project with NEYQORA"
          git push

      - name: Complete GitHub issue
        if: ${{ github.event_name == 'issues' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "✅ NEYQORA proje görevi başarıyla tamamlandı. Proje üretildi, Python testleri ve sözdizimi kontrolleri geçti; dosyalar GitHub'a kaydedildi."
          gh issue close "$ISSUE_NUMBER" --repo "$REPO"
