name: Generate Project

on:
  workflow_dispatch:
    inputs:
      request:
        description: "Describe the project to generate"
        required: true
        type: string
  issues:
    types: [opened]

jobs:
  generate:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.actor == 'perdeson359-design') }}
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate project from NEYQORA
        env:
          NEYQORA_URL: https://neyqora.kosseofficial.workers.dev
          PROJECT_REQUEST: ${{ github.event_name == 'issues' && github.event.issue.title || inputs.request }}
          ISSUE_BODY: ${{ github.event_name == 'issues' && github.event.issue.body || '' }}
          ISSUE_AUTHOR: ${{ github.event_name == 'issues' && github.event.issue.user.login || '' }}
          ISSUE_NUMBER: ${{ github.event_name == 'issues' && github.event.issue.number || '' }}
        run: |
          set -e
          if [ "${{ github.event_name }}" = "issues" ]; then
            if [ "$ISSUE_AUTHOR" != "perdeson359-design" ]; then
              echo "Ignoring issue from non-owner."
              exit 0
            fi
            PROJECT_REQUEST="$PROJECT_REQUEST

$ISSUE_BODY"
          fi
          mkdir -p requests/generated

          python - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          url = os.environ["NEYQORA_URL"] + "/api/project"
          body = json.dumps({"request": os.environ["PROJECT_REQUEST"], "issueNumber": os.environ.get("ISSUE_NUMBER")}).encode()
          req = Request(url, data=body, headers={"content-type": "application/json"}, method="POST")

          with urlopen(req, timeout=120) as response:
              data = json.load(response)

          if not data.get("ok"):
              raise SystemExit("NEYQORA project generation failed: " + str(data))

          with open("/tmp/project.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False)
          PY

          python - <<'PY'
          import json
          import os
          import pathlib

          data = json.load(open("/tmp/project.json", encoding="utf-8"))
          request = os.environ["PROJECT_REQUEST"]
          safe_name = "".join(c.lower() if c.isalnum() else "-" for c in request).strip("-")[:40] or "project"
          root = pathlib.Path("projects") / safe_name
          root.mkdir(parents=True, exist_ok=True)

          for item in data["files"]:
              path = pathlib.Path(item["path"])
              if path.is_absolute() or ".." in path.parts:
                  raise SystemExit("Unsafe generated path: " + str(path))
              target = root / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(item["content"], encoding="utf-8")

          print("Generated project:", root)
          PY

      - name: Run generated Python tests (first pass)
        id: first_test
        continue-on-error: true
        shell: bash
        run: |
          set -e
          test_files=$(find projects -type f -name 'test_*.py' | sort)
          if [ -z "$test_files" ]; then
            echo "No Python tests were generated."
          else
            : > /tmp/test-output.txt
            while IFS= read -r test_file; do
              echo "Testing $test_file" | tee -a /tmp/test-output.txt
              if ! timeout 30s python "$test_file" 2>&1 | tee -a /tmp/test-output.txt; then
                echo "TEST_FAILED=1" >> "$GITHUB_OUTPUT"
                exit 1
              fi
            done <<< "$test_files"
          fi

      - name: Repair project once after test failure
        if: steps.first_test.outcome == 'failure'
        env:
          NEYQORA_URL: https://neyqora.kosseofficial.workers.dev
          PROJECT_REQUEST: ${{ github.event_name == 'issues' && github.event.issue.title || inputs.request }}
          ISSUE_BODY: ${{ github.event_name == 'issues' && github.event.issue.body || '' }}
        shell: bash
        run: |
          set -e
          if [ "${{ github.event_name }}" = "issues" ]; then
            PROJECT_REQUEST="$PROJECT_REQUEST\n\n$ISSUE_BODY"
            export PROJECT_REQUEST
          fi
          python - <<'PY'
          import json, os, pathlib
          from urllib.request import Request, urlopen

          error_log = ""
          log_path = pathlib.Path("/tmp/test-output.txt")
          if log_path.exists():
              error_log = log_path.read_text(encoding="utf-8", errors="replace")[-12000:]

          repair_request = (
              os.environ["PROJECT_REQUEST"]
              + " Testleri başarısız olan projeyi düzelt ve test edilebilir şekilde yeniden üret. "
              + "Aşağıdaki gerçek test çıktısını dikkate al:\n"
              + error_log
          )

          url = os.environ["NEYQORA_URL"] + "/api/project"
          body = json.dumps({
              "request": repair_request
          }).encode()
          req = Request(url, data=body, headers={"content-type": "application/json"}, method="POST")

          with urlopen(req, timeout=120) as response:
              data = json.load(response)
          if not data.get("ok"):
              raise SystemExit("NEYQORA repair failed: " + str(data))

          request = os.environ["PROJECT_REQUEST"]
          safe_name = "".join(c.lower() if c.isalnum() else "-" for c in request).strip("-")[:40] or "project"
          root = pathlib.Path("projects") / safe_name
          root.mkdir(parents=True, exist_ok=True)

          for item in data["files"]:
              path = pathlib.Path(item["path"])
              if path.is_absolute() or ".." in path.parts or "\\" in str(path):
                  raise SystemExit("Unsafe repaired path: " + str(path))
              target = root / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(item["content"], encoding="utf-8")
          PY

      - name: Run generated Python tests (final pass)
        shell: bash
        run: |
          set -e
          test_files=$(find projects -type f -name 'test_*.py' | sort)
          if [ -z "$test_files" ]; then
            echo "No Python tests were generated."
          else
            while IFS= read -r test_file; do
              echo "Testing $test_file"
              timeout 30s python "$test_file"
            done <<< "$test_files"
          fi

      - name: Validate generated Python syntax
        shell: bash
        run: |
          set -e
          python_files=$(find projects -type f -name '*.py' | sort)
          if [ -z "$python_files" ]; then
            echo "No Python files found."
            exit 0
          fi
          while IFS= read -r python_file; do
            echo "Compiling $python_file"
            timeout 30s python -m py_compile "$python_file"
          done <<< "$python_files"

      - name: Write project test status
        if: always()
        shell: bash
        run: |
          set -e
          mkdir -p requests/generated
          if [ "${{ steps.final_gate.outcome }}" = "success" ]; then
            status="passed"
          else
            status="failed"
          fi
          cat > requests/generated/latest-test-status.json <<EOF
          {
            "status": "$status",
            "first_test": "${{ steps.first_test.outcome }}",
            "final_gate": "${{ steps.final_gate.outcome }}",
            "workflow": "${{ github.workflow }}",
            "run_id": "${{ github.run_id }}"
          }
          EOF

      - name: Write machine-readable test report
        if: always()
        shell: bash
        run: |
          set -e
          mkdir -p requests/generated
          first="${{ steps.first_test.outcome }}"
          cat > requests/generated/test-report.json <<EOF
          {
            "schema": "neyqora.project-test.v1",
            "first_test": "$first",
            "final_gate": "${{ steps.final_gate.outcome }}",
            "run_id": "${{ github.run_id }}",
            "repository": "${{ github.repository }}",
            "sha": "${{ github.sha }}"
          }
          EOF

      - name: Upload test status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neyqora-test-status
          path: |
            requests/generated/latest-test-status.json
            /tmp/test-output.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: Validate repaired Python safety
        if: steps.first_test.outcome == 'failure'
        shell: bash
        run: |
          set -e
          if grep -R -nE '\\b(eval|exec)[[:space:]]*\\(' projects --include='*.py'; then
            echo "Forbidden Python execution primitive found."
            exit 1
          fi
          echo "Repaired project safety check: PASS"

      - name: Final project gate
        id: final_gate
        shell: bash
        run: |
          set -e
          test_files=$(find projects -type f -name 'test_*.py' | sort)
          if [ -z "$test_files" ]; then
            echo "No tests found; refusing to publish."
            exit 1
          fi
          while IFS= read -r test_file; do
            echo "Final gate: $test_file"
            timeout 30s python "$test_file"
          done <<< "$test_files"
          echo "NEYQORA final project gate: PASS"

      - name: Publish CI result to issue
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          FINAL_GATE: ${{ steps.final_gate.outcome }}
          FIRST_TEST: ${{ steps.first_test.outcome }}
        shell: bash
        run: |
          set -e
          if [ "$FINAL_GATE" = "success" ]; then
            STATUS="passed"
          else
            STATUS="failed"
          fi
          cat > /tmp/ci-comment.md <<EOF
          <!-- NEYQORA_CI_RESULT {"status":"$STATUS","tested":true,"run_id":"${{ github.run_id }}","sha":"${{ github.sha }}","first_test":"$FIRST_TEST","final_gate":"$FINAL_GATE"} -->
          NEYQORA CI sonucu: **$STATUS**
          - Run: ${{ github.run_id }}
          - İlk test: $FIRST_TEST
          - Final test: $FINAL_GATE
          EOF
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body-file /tmp/ci-comment.md

      - name: Commit generated project
        if: steps.final_gate.outcome == 'success'
        run: |
          git config user.name "NEYQORA"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/ requests/generated/
          git diff --cached --quiet && echo "No changes to commit." && exit 0
          git commit -m "Generate and test project with NEYQORA"
          git push

