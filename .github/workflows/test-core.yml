name: Core Tests

on:
  push:
    paths: ["src/index.js","wrangler.jsonc","tests/**",".github/workflows/test-core.yml"]
  pull_request:
    paths: ["src/index.js","wrangler.jsonc","tests/**",".github/workflows/test-core.yml"]

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check src/index.js
      - run: node tests/test-core.mjs
