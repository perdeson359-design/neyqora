name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: neyqora-production-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy NEYQORA Worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --var DEPLOY_COMMIT:${{ github.sha }}
      - name: Sync Owner secret to Worker
        if: ${{ secrets.OWNER_AUTH_TOKEN != '' }}
        shell: bash
        env:
          OWNER_AUTH_TOKEN: ${{ secrets.OWNER_AUTH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${OWNER_AUTH_TOKEN:-}" ]; then
            echo "OWNER_AUTH_TOKEN is empty; keeping existing Worker secret unchanged."
            exit 0
          fi
          printf '%s' "$OWNER_AUTH_TOKEN" | npx wrangler secret put OWNER_AUTH_TOKEN --name neyqora --api-token "$CLOUDFLARE_API_TOKEN" --account-id "$CLOUDFLARE_ACCOUNT_ID"
