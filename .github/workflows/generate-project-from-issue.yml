name: Generate Project From Issue

on:
  issues:
    types: [opened]

jobs:
  generate:
    if: ${{ github.actor == 'perdeson359-design' }}
    permissions:
      contents: write
      issues: write
    uses: ./.github/workflows/generate-project.yml
    with:
      request: ${{ github.event.issue.title }}
      issue_number: ${{ github.event.issue.number }}
