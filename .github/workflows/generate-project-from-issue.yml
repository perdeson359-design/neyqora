name: Generate Project From Issue

on:
  issues:
    types: [opened]

jobs:
  generate:
    if: ${{ github.actor == 'perdeson359-design' }}
    permissions:
      contents: write
      issues: write
    uses: ./.github/workflows/generate-project.yml
    with:
      request: ${{ format('{0}\n\n{1}', github.event.issue.title, github.event.issue.body) }}
      issue_number: ${{ github.event.issue.number }}
