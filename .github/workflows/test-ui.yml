name: UI Script Test

on:
  push:
    paths:
      - "src/index.js"
      - ".github/workflows/test-ui.yml"
  pull_request:
    paths:
      - "src/index.js"
      - ".github/workflows/test-ui.yml"

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check worker
        run: node --check src/index.js
      - name: Extract and check browser script
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path("src/index.js").read_text(encoding="utf-8")
          scripts=re.findall(r"<script(?:[^>]*)>([\s\S]*?)</script>", html, flags=re.I)
          if not scripts:
              raise SystemExit("No browser scripts found")
          for index, script in enumerate(scripts, 1):
              Path(f"/tmp/browser-{index}.js").write_text(script, encoding="utf-8")
          print(f"Browser scripts found: {len(scripts)}")
          PY
          for file in /tmp/browser-*.js; do
            node --check "$file"
          done
          python - <<'PY'
          from pathlib import Path
          source=Path("src/index.js").read_text(encoding="utf-8")
          required=[
            'id="account-button"',
            'window.neyqoraAccount=function',
            'authPassword.required=!(forgot||profile||magic)',
            'authPassword.hidden=forgot||profile||magic',
            'authName.required=register||profile',
            'window.neyqoraLocalChat=async function',
            'localStorage.getItem("neyqora_local_ai_url")',
            'localStorage.getItem("neyqora_local_ai_model")',
            'auth-overlay',
            '.auth-overlay.open{display:flex}',
            'register-tab',
            '/?auth=register',
            'const authFromUrl=new URLSearchParams(location.search).get("auth")',
            'if(authFromUrl==="register"||authFromUrl==="login")',
            'max-height:calc(100dvh - 40px)',
            'overflow:auto;-webkit-overflow-scrolling:touch'
          ]
          missing=[item for item in required if item not in source]
          if missing:
              raise SystemExit("Missing UI contract(s): "+", ".join(missing))
          if source.count('id="account-button"') != 1:
              raise SystemExit("account-button must exist exactly once")
          if 'accountButton?.addEventListener("click"' in source:
              raise SystemExit("legacy accountButton listener must not exist")
          if 'onpointerup=' in source:
              raise SystemExit("inline pointerup handlers are forbidden")
          print("NEYQORA auth/mobile/local-AI UI contract: PASS")
          PY
      - name: Verify P3 native mobile contract
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path("src/index.js").read_text(encoding="utf-8")
          required=[
            'id="mobile-share"',
            'id="mobile-camera"',
            'id="mobile-save"',
            'id="mobile-notifications"',
            'id="mobile-reminder"',
            'window.neyqoraMobile={haptic,share,camera,saveChat,notifications,reminder}',
            'async function saveChat()',
            'async function reminder()',
            'nativePlugins().Filesystem',
            'nativePlugins().LocalNotifications',
            'neyqora-sohbet.txt',
            '1 dakikalık hatırlatman hazır.'
          ]
          missing=[item for item in required if item not in source]
          if missing:
              raise SystemExit("Missing P3 native mobile contract(s): "+", ".join(missing))
          print("NEYQORA P3 native mobile contract: PASS")
          PY
