name: UI Script Test

on:
  push:
    paths:
      - "src/index.js"
      - ".github/workflows/test-ui.yml"
  pull_request:
    paths:
      - "src/index.js"
      - ".github/workflows/test-ui.yml"

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check worker
        run: node --check src/index.js
      - name: Extract and check browser script
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path("src/index.js").read_text(encoding="utf-8")
          scripts=re.findall(r"<script(?:[^>]*)>([\\s\\S]*?)</script>", html, flags=re.I)
          if not scripts:
              raise SystemExit("No browser scripts found")
          for index, script in enumerate(scripts, 1):
              Path(f"/tmp/browser-{index}.js").write_text(script, encoding="utf-8")
          print(f"Browser scripts found: {len(scripts)}")
          PY
          for file in /tmp/browser-*.js; do
            node --check "$file"
          done
