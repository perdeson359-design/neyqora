name: UI Script Test

on:
  push:
    paths:
      - "src/index.js"
      - ".github/workflows/test-ui.yml"
  pull_request:
    paths:
      - "src/index.js"
      - ".github/workflows/test-ui.yml"

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check worker
        run: node --check src/index.js
      - name: Extract and check browser script
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path("src/index.js").read_text(encoding="utf-8")
          scripts=re.findall(r"<script(?:[^>]*)>([\s\S]*?)</script>", html, flags=re.I)
          if not scripts:
              raise SystemExit("No browser scripts found")
          for index, script in enumerate(scripts, 1):
              Path(f"/tmp/browser-{index}.js").write_text(script, encoding="utf-8")
          print(f"Browser scripts found: {len(scripts)}")
          PY
          for file in /tmp/browser-*.js; do
            node --check "$file"
          done
          python - <<'PY'
          from pathlib import Path
          import re
          source=Path("src/index.js").read_text(encoding="utf-8")
          assert 'id="account-button"' in source
          assert 'window.neyqoraAccount=function' in source
          assert 'document.getElementById("account-button")?.addEventListener("click"' in source
          assert source.count('id="account-button"') == 1
          assert 'authPassword.required=!(forgot||profile)' in source
          assert 'authPassword.hidden=forgot||profile' in source
          assert 'authName.required=register||profile' in source
          assert 'window.neyqoraLocalChat=async function' in source
          assert 'localStorage.getItem("neyqora_local_ai_url")' in source
          assert 'localStorage.getItem("neyqora_local_ai_model")' in source
          assert source.count('accountButton?.addEventListener("click"') == 0
          assert 'onpointerup=' not in source
          assert 'auth-overlay' in source and '.auth-overlay.open{display:flex}' in source
          assert 'max-height:calc(100dvh - 40px)' in source
          assert 'overflow:auto;-webkit-overflow-scrolling:touch' in source
          print("NEYQORA auth/mobile/local-AI UI contract: PASS")
          PY
