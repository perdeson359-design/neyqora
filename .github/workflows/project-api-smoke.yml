name: NEYQORA Project API Smoke

on:
  push:
    branches: [main]

jobs:
  project-api:
    runs-on: ubuntu-latest
    steps:
      - name: Call project API
        env:
          NEYQORA_URL: https://neyqora.kosseofficial.workers.dev
        run: |
          set -euo pipefail
          printf '%s' '{"request":"Hesap makinesi üret ve test dosyası ekle.","issueNumber":999}' > /tmp/request.json
          code=$(curl -sS -o /tmp/response.json -w "%{http_code}"             -A "NEYQORA-GitHub-Actions-Project-Smoke"             -H "Origin: https://neyqora.kosseofficial.workers.dev"             -H "Accept: application/json"             -H "Content-Type: application/json"             --data-binary @/tmp/request.json             "$NEYQORA_URL/api/project")
          echo "HTTP=$code"
          cat /tmp/response.json
          test "$code" = "200"
          python -c 'import json; d=json.load(open("/tmp/response.json")); assert d.get("ok") and d.get("files"), d'
