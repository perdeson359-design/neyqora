name: Self Host Runtime

on:
  push:
    paths: ["server.mjs","package.json","Dockerfile","tests/test-self-host.mjs",".github/workflows/test-self-host.yml"]
  pull_request:
    paths: ["server.mjs","package.json","Dockerfile","tests/test-self-host.mjs",".github/workflows/test-self-host.yml"]

jobs:
  self-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --ignore-scripts
      - run: node --check server.mjs
      - run: node tests/test-self-host.mjs
