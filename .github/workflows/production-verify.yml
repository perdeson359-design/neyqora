name: Production Verification

on:
  workflow_run:
    workflows:
      - Deploy Production
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: neyqora-production-verification
  cancel-in-progress: true

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEYQORA_URL: https://neyqora.kosseofficial.workers.dev
      EXPECTED_VERSION: "6.3"
      EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Deployment gate
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' }}
        run: |
          echo "Deploy Production did not succeed; verification is not applicable."
          exit 0

      - name: Verification target
        run: |
          echo "Git commit under verification: $EXPECTED_COMMIT"
          echo "Expected production version: $EXPECTED_VERSION"
          echo "Production URL: $NEYQORA_URL"

      - name: Wait for production Worker
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            echo "Production health check $attempt/30"
            if curl -fsS -A "NEYQORA-Production-Verify" -H "Accept: application/json" "$NEYQORA_URL/api/health" > /tmp/health.json; then
              cat /tmp/health.json
              if jq -e --arg expected "$EXPECTED_VERSION" '.ok == true and .name == "NEYQORA" and .version == $expected and .router == true and .agent == true' /tmp/health.json >/dev/null; then
                if curl -fsS -c /tmp/neyqora.cookies -b /tmp/neyqora.cookies -A "NEYQORA-Production-Verify" "$NEYQORA_URL/api/session" >/tmp/session.json; then
                  jq -e '.ok == true and (.userId | type == "string")' /tmp/session.json >/dev/null
                  echo "Production health + session: PASS"
                  exit 0
                fi
                echo "Worker version is ready but signed session endpoint is not deployed yet."
              fi
              echo "Production not ready yet."
            else
              echo "Worker is not reachable yet."
            fi
            sleep 20
          done
          echo "Production Worker did not become healthy in time."
          exit 1

      - name: Verify security headers
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -D /tmp/headers.txt -o /dev/null -A "NEYQORA-Production-Verify" "$NEYQORA_URL/"
          grep -qi '^x-content-type-options: nosniff' /tmp/headers.txt
          grep -qi '^x-frame-options: DENY' /tmp/headers.txt
          grep -qi '^referrer-policy: no-referrer' /tmp/headers.txt
          grep -qi '^permissions-policy:' /tmp/headers.txt
          grep -qi '^cross-origin-opener-policy: same-origin' /tmp/headers.txt
          grep -qi '^cross-origin-resource-policy: same-origin' /tmp/headers.txt
          grep -qi '^x-permitted-cross-domain-policies: none' /tmp/headers.txt
          grep -qi '^strict-transport-security:' /tmp/headers.txt
          echo "Security headers: PASS"

      - name: Verify agent routing and project tool
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/agent-project-request.json <<'JSON'
          {
            "message": "Hesap makinesi projesi üret.",
            "userId": "production-verification-agent",
            "history": []
          }
          JSON
          curl -fsS -c /tmp/neyqora.cookies -b /tmp/neyqora.cookies -A "NEYQORA-Production-Verify" "$NEYQORA_URL/api/session" >/tmp/session.json
          cat /tmp/session.json
          code=$(curl -sS -b /tmp/neyqora.cookies -c /tmp/neyqora.cookies -o /tmp/agent-project.json -w "%{http_code}" -A "NEYQORA-Production-Verify" -H "Origin: $NEYQORA_URL" -H "Content-Type: application/json" --data-binary @/tmp/agent-project-request.json "$NEYQORA_URL/api/chat")
          echo "Agent project HTTP=$code"
          cat /tmp/agent-project.json
          test "$code" = "200"
          python - <<'PY'
          import json
          d = json.load(open("/tmp/agent-project.json", encoding="utf-8"))
          assert d.get("intent") == "project", d
          plan = d.get("plan") or {}
          steps = plan.get("steps") or []
          assert any(s.get("tool") == "project" and s.get("action") == "generate_project" for s in steps), plan
          results = d.get("toolResults") or []
          project = next((r for r in results if r.get("tool") == "project"), None)
          assert project and project.get("ok") is True, d
          files = project.get("files") or []
          paths = [str(x.get("path", "")) for x in files]
          assert any(p.lower().startswith("test_") and p.lower().endswith(".py") for p in paths), paths
          assert (d.get("agentStatus") or {}).get("status") == "success", d
          print("Agent routing + project tool: PASS")
          print("Generated files:", paths)
          PY

      - name: Verify project generation contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          payload = {"request": "Production doğrulama: basit bir Python hesap makinesi üret. test_hesap_makinesi.py ile toplama, çıkarma, çarpma, bölme ve sıfıra bölmeyi test et."}
          with open("/tmp/project-request.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False)
          PY
          code=$(curl -sS -o /tmp/project.json -w "%{http_code}" -A "NEYQORA-Production-Verify" -H "Origin: $NEYQORA_URL" -H "Content-Type: application/json" --cookie /tmp/neyqora.cookies --cookie-jar /tmp/neyqora.cookies --data-binary @/tmp/project-request.json "$NEYQORA_URL/api/project")
          echo "Project API HTTP=$code"
          cat /tmp/project.json
          test "$code" = "200"
          python - <<'PY'
          import json
          with open("/tmp/project.json", encoding="utf-8") as f:
              d = json.load(f)
          assert d.get("ok") is True, d
          files = d.get("files") or []
          assert files, d
          paths = [str(x.get("path", "")) for x in files]
          assert any(p.lower().startswith("test_") and p.lower().endswith(".py") for p in paths), paths
          assert d.get("testable") is True, d
          print("Production project contract: PASS")
          print("Files:", paths)
          PY

      - name: Execute generated project tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import pathlib
          d = json.load(open("/tmp/project.json", encoding="utf-8"))
          root = pathlib.Path("/tmp/neyqora-production-project").resolve()
          root.mkdir(parents=True, exist_ok=True)
          for item in d.get("files") or []:
              path = str(item.get("path", ""))
              content = str(item.get("content", ""))
              p = (root / path).resolve()
              if root != p and root not in p.parents:
                  raise SystemExit(f"Unsafe project path: {path}")
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content, encoding="utf-8")
          tests = list(root.glob("test_*.py"))
          if not tests:
              raise SystemExit("No test_*.py generated")
          print("Generated files:", [str(p.relative_to(root)) for p in sorted(root.rglob("*")) if p.is_file()])
          print("Tests:", [str(p.relative_to(root)) for p in tests])
          PY
          python - <<'PY'
          import pathlib, re
          root = pathlib.Path("/tmp/neyqora-production-project")
          pattern = re.compile(r"\b(eval|exec)\s*\(")
          hits = []
          for path in root.rglob("*.py"):
              if pattern.search(path.read_text(encoding="utf-8")):
                  hits.append(str(path))
          if hits:
              print("Unsafe eval/exec detected:", *hits, sep="\n")
              raise SystemExit(1)
          print("Generated project safety scan: PASS")
          PY
          while IFS= read -r -d '' file; do
            python -m py_compile "$file"
          done < <(find /tmp/neyqora-production-project -type f -name '*.py' -print0)
          cd /tmp/neyqora-production-project
          for test in test_*.py; do
            timeout 30s python "$test"
          done
          echo "Generated project tests: PASS"

      - name: Verify V6 productivity contracts
        shell: bash
        run: |
          set -euo pipefail

          user_id="production-v6-$(date +%s)"

          cat > /tmp/v6-event-request.json <<JSON
          {"userId":"$user_id","title":"V6 doğrulama","startAt":"2026-10-06T14:00:00Z","endAt":"2026-10-06T15:00:00Z"}
          JSON
          event_code=$(curl -sS -o /tmp/v6-event.json -w "%{http_code}"             -A "NEYQORA-Production-Verify" -H "Origin: $NEYQORA_URL" -H "Content-Type: application/json"             --cookie /tmp/neyqora.cookies --cookie-jar /tmp/neyqora.cookies             --data-binary @/tmp/v6-event-request.json "$NEYQORA_URL/api/calendar/events")
          echo "Calendar POST HTTP=$event_code"
          cat /tmp/v6-event.json
          test "$event_code" = "200"
          jq -e '.ok == true and .event.title == "V6 doğrulama"' /tmp/v6-event.json >/dev/null

          cat > /tmp/v6-email-request.json <<JSON
          {"userId":"$user_id","to":"v6@example.com","subject":"V6 doğrulama","body":"V6 e-posta taslağı"}
          JSON
          email_code=$(curl -sS -o /tmp/v6-email.json -w "%{http_code}"             -A "NEYQORA-Production-Verify" -H "Origin: $NEYQORA_URL" -H "Content-Type: application/json"             --cookie /tmp/neyqora.cookies --cookie-jar /tmp/neyqora.cookies             --data-binary @/tmp/v6-email-request.json "$NEYQORA_URL/api/email/drafts")
          echo "Email POST HTTP=$email_code"
          cat /tmp/v6-email.json
          test "$email_code" = "200"
          jq -e '.ok == true and .draft.status == "draft"' /tmp/v6-email.json >/dev/null

          run_at=$(python - <<'PY'
          from datetime import datetime, timedelta, timezone
          print((datetime.now(timezone.utc) + timedelta(minutes=10)).isoformat().replace("+00:00","Z"))
          PY
          )
          cat > /tmp/v6-automation-request.json <<JSON
          {"userId":"$user_id","title":"V6 otomasyon","runAt":"$run_at","prompt":"V6 doğrulama görevi"}
          JSON
          automation_code=$(curl -sS -o /tmp/v6-automation.json -w "%{http_code}"             -A "NEYQORA-Production-Verify" -H "Origin: $NEYQORA_URL" -H "Content-Type: application/json"             --cookie /tmp/neyqora.cookies --cookie-jar /tmp/neyqora.cookies             --data-binary @/tmp/v6-automation-request.json "$NEYQORA_URL/api/automations")
          echo "Automation POST HTTP=$automation_code"
          cat /tmp/v6-automation.json
          test "$automation_code" = "200"
          jq -e '.ok == true and .automation.status == "pending"' /tmp/v6-automation.json >/dev/null

          echo "V6 productivity contracts: PASS"

      - name: Verify Resend email delivery contract
        shell: bash
        run: |
          set -euo pipefail
          email_code=$(curl -sS -o /tmp/resend-email.json -w "%{http_code}"             -A "NEYQORA-Production-Verify" -H "Origin: $NEYQORA_URL" -H "Content-Type: application/json"             --cookie /tmp/neyqora.cookies --cookie-jar /tmp/neyqora.cookies             --data-binary '{"userId":"production-resend-test","to":"delivered@resend.dev","subject":"NEYQORA Resend doğrulama","body":"NEYQORA Production Resend bağlantı testi."}'             "$NEYQORA_URL/api/email/send")
          echo "Resend POST HTTP=$email_code"
          cat /tmp/resend-email.json
          test "$email_code" = "200"
          jq -e '.ok == true and .email.status == "sent" and (.email.id | type == "string") and (.email.id | length > 0)' /tmp/resend-email.json >/dev/null
          echo "Resend email contract: PASS"

      - name: Verify production authentication contract
        shell: bash
        run: |
          set -euo pipefail
          auth_email="neyqora-production-$(date +%s%N)@example.com"
          auth_password="Aa1-$(date +%s%N)"
          cat > /tmp/auth-register.json <<JSON
          {"name":"NEYQORA Test","email":"$auth_email","password":"$auth_password"}
          JSON
          code=$(curl -sS -o /tmp/auth-register-response.json -w "%{http_code}" -c /tmp/auth.cookies -b /tmp/auth.cookies -A "NEYQORA-Production-Verify" -H "Origin: $NEYQORA_URL" -H "Content-Type: application/json" --data-binary @/tmp/auth-register.json "$NEYQORA_URL/api/auth/register")
          echo "Auth register HTTP=$code"
          cat /tmp/auth-register-response.json
          test "$code" = "201"
          jq -e '.ok == true and (.user.id | type == "string") and .user.email == $email' --arg email "$auth_email" /tmp/auth-register-response.json >/dev/null
          code=$(curl -sS -o /tmp/auth-me.json -w "%{http_code}" -b /tmp/auth.cookies -c /tmp/auth.cookies -A "NEYQORA-Production-Verify" "$NEYQORA_URL/api/auth/me")
          test "$code" = "200"
          jq -e '.ok == true and .user.email == $email' --arg email "$auth_email" /tmp/auth-me.json >/dev/null
          code=$(curl -sS -o /tmp/auth-duplicate.json -w "%{http_code}" -b /tmp/auth.cookies -c /tmp/auth.cookies -A "NEYQORA-Production-Verify" -H "Origin: $NEYQORA_URL" -H "Content-Type: application/json" --data-binary @/tmp/auth-register.json "$NEYQORA_URL/api/auth/register")
          test "$code" = "409"
          code=$(curl -sS -o /tmp/auth-logout.json -w "%{http_code}" -b /tmp/auth.cookies -c /tmp/auth.cookies -A "NEYQORA-Production-Verify" -X POST "$NEYQORA_URL/api/auth/logout")
          test "$code" = "200"
          jq -e '.ok == true' /tmp/auth-logout.json >/dev/null
          code=$(curl -sS -o /tmp/auth-login.json -w "%{http_code}" -b /tmp/auth.cookies -c /tmp/auth.cookies -A "NEYQORA-Production-Verify" -H "Origin: $NEYQORA_URL" -H "Content-Type: application/json" --data-binary @/tmp/auth-register.json "$NEYQORA_URL/api/auth/login")
          test "$code" = "200"
          jq -e '.ok == true and .user.email == $email' --arg email "$auth_email" /tmp/auth-login.json >/dev/null
          code=$(curl -sS -o /tmp/auth-bad-login.json -w "%{http_code}" -b /tmp/auth.cookies -c /tmp/auth.cookies -A "NEYQORA-Production-Verify" -H "Origin: $NEYQORA_URL" -H "Content-Type: application/json" --data-binary "{\"email\":\"$auth_email\",\"password\":\"wrong\"}" "$NEYQORA_URL/api/auth/login")
          test "$code" = "401"
          code=$(curl -sS -o /tmp/auth-delete.json -w "%{http_code}" -b /tmp/auth.cookies -c /tmp/auth.cookies -A "NEYQORA-Production-Verify" -H "Origin: $NEYQORA_URL" -X DELETE "$NEYQORA_URL/api/auth/account")
          test "$code" = "200"
          jq -e '.ok == true' /tmp/auth-delete.json >/dev/null
          code=$(curl -sS -o /tmp/auth-final-me.json -w "%{http_code}" -b /tmp/auth.cookies -c /tmp/auth.cookies -A "NEYQORA-Production-Verify" "$NEYQORA_URL/api/auth/me")
          test "$code" = "200"
          jq -e '.ok == false and .user == null' /tmp/auth-final-me.json >/dev/null
          echo "Production authentication contract: PASS"

      - name: Production gate
        run: |
          echo "NEYQORA production verification: PASS"
          echo "Verified commit: $EXPECTED_COMMIT"
          echo "Verified version: $EXPECTED_VERSION"
