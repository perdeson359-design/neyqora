name: Mobile Build
on:
  push:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Install mobile dependencies
        run: npm install
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Android project
        run: npx cap sync android
      - name: Build Android debug APK
        run: ./android/gradlew -p android assembleDebug --no-daemon
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: neyqora-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
  ios:
    runs-on: macos-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install mobile dependencies
        run: npm install
      - name: Generate iOS project
        run: npx cap add ios
      - name: Sync iOS project
        run: npx cap sync ios
      - name: Build iOS Simulator target
        run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
      - name: Mobile config contract
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const pkg=JSON.parse(fs.readFileSync("package.json","utf8"));
          const cfg=fs.readFileSync("capacitor.config.ts","utf8");
          if(!pkg.dependencies["@capacitor/core"]) throw new Error("Capacitor core missing");
          for(const token of ["com.neyqora.assistant","NEYQORA_APP_URL","cleartext: false"]) if(!cfg.includes(token)) throw new Error("Missing mobile contract: "+token);
          console.log("NEYQORA mobile config contract: PASS");
          NODE
