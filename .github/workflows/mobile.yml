name: Mobile Build
on:
  push:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm", cache-dependency-path: mobile/package.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Verify production endpoint
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 https://neyqora.kosseofficial.workers.dev/api/health
      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Capacitor configuration
        run: npx cap doctor
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Android project
        run: npx cap sync android
      - name: Verify Android application identity
        run: grep -R 'com.neyqora.assistant' android/app/src/main/AndroidManifest.xml android/app/build.gradle*
      - name: Build Android debug APK
        run: ./android/gradlew -p android assembleDebug --no-daemon
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: neyqora-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    timeout-minutes: 25
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: mobile/package.json }
      - name: Verify production endpoint
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 https://neyqora.kosseofficial.workers.dev/api/health
      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Capacitor configuration
        run: npx cap doctor
      - name: Generate iOS project
        run: npx cap add ios
      - name: Sync iOS project
        run: npx cap sync ios
      - name: Verify iOS application identity
        run: grep -R 'com.neyqora.assistant' ios/App/App/Info.plist ios/App/App.xcodeproj/project.pbxproj
      - name: Build iOS Simulator target
        run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
      - name: Mobile config contract
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const pkg=JSON.parse(fs.readFileSync("package.json","utf8"));
          const cfg=fs.readFileSync("capacitor.config.ts","utf8");
          for (const dep of ["@capacitor/core","@capacitor/app","@capacitor/haptics","@capacitor/share","@capacitor/status-bar","@capacitor/splash-screen"]) {
            if (!pkg.dependencies[dep]) throw new Error("Missing dependency: "+dep);
          }
          for (const token of ["com.neyqora.assistant","NEYQORA_APP_URL","cleartext: false","allowNavigation"]) {
            if (!cfg.includes(token)) throw new Error("Missing mobile contract: "+token);
          }
          console.log("NEYQORA mobile config contract: PASS");
          NODE
