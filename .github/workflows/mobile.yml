name: Mobile Build
on:
  push:
    paths: ["mobile/**", "src/index.js", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["mobile/**", "src/index.js", ".github/workflows/mobile.yml"]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "20", cache: "npm", cache-dependency-path: mobile/package.json }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - name: Verify production endpoint
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 https://neyqora.kosseofficial.workers.dev/api/health
      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Capacitor configuration and native plugins
        run: |
          npx cap doctor
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const pkg=JSON.parse(fs.readFileSync("package.json","utf8"));
          const cfg=fs.readFileSync("capacitor.config.ts","utf8");
          for (const dep of ["@capacitor/core","@capacitor/app","@capacitor/haptics","@capacitor/share","@capacitor/status-bar","@capacitor/splash-screen","@capacitor/camera","@capacitor/filesystem","@capacitor/keyboard","@capacitor/local-notifications","@capacitor/network","@capacitor/push-notifications"]) {
            if (!pkg.dependencies[dep]) throw new Error("Missing dependency: "+dep);
          }
          for (const token of ["com.neyqora.assistant","NEYQORA_APP_URL","cleartext: false","allowNavigation","PushNotifications","Keyboard"]) {
            if (!cfg.includes(token)) throw new Error("Missing mobile contract: "+token);
          }
          console.log("NEYQORA native capability contract: PASS");
          NODE
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Android project
        run: npx cap sync android
      - name: Configure Android deep link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          marker="</activity>"
          intent='''        <intent-filter>
                    <action android:name="android.intent.action.VIEW" />
                    <category android:name="android.intent.category.DEFAULT" />
                    <category android:name="android.intent.category.BROWSABLE" />
                    <data android:scheme="neyqora" android:host="open" />
                </intent-filter>
          '''
          if 'android:scheme="neyqora"' not in s:
              s=s.replace(marker,intent+"\n    "+marker,1)
          p.write_text(s)
          PY
      - name: Verify Android application identity and deep link
        run: |
          grep -R 'com.neyqora.assistant' android/app/src/main/AndroidManifest.xml android/app/build.gradle*
          grep -R 'android:scheme="neyqora"' android/app/src/main/AndroidManifest.xml
      - name: Build Android debug APK
        run: ./android/gradlew -p android assembleDebug --no-daemon
      - name: Build Android release AAB
        run: ./android/gradlew -p android bundleRelease --no-daemon
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neyqora-android
          path: |
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "20", cache: "npm", cache-dependency-path: mobile/package.json }
      - name: Verify production endpoint
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 https://neyqora.kosseofficial.workers.dev/api/health
      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund
      - name: Validate native plugins
        run: |
          npx cap doctor
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const pkg=JSON.parse(fs.readFileSync("package.json","utf8"));
          for (const dep of ["@capacitor/camera","@capacitor/filesystem","@capacitor/keyboard","@capacitor/local-notifications","@capacitor/network","@capacitor/push-notifications"]) {
            if (!pkg.dependencies[dep]) throw new Error("Missing dependency: "+dep);
          }
          console.log("NEYQORA iOS native plugin contract: PASS");
          NODE
      - name: Generate iOS project
        run: npx cap add ios
      - name: Sync iOS project
        run: npx cap sync ios
      - name: Configure iOS deep link
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          p=Path("ios/App/App/Info.plist")
          data=plistlib.loads(p.read_bytes())
          types=data.setdefault("CFBundleURLTypes", [])
          if not any("neyqora" in item.get("CFBundleURLSchemes", []) for item in types):
              types.append({"CFBundleURLName":"com.neyqora.assistant","CFBundleURLSchemes":["neyqora"]})
          p.write_bytes(plistlib.dumps(data, fmt=plistlib.FMT_XML))
          PY
      - name: Verify iOS application identity and deep link
        run: |
          grep -R 'com.neyqora.assistant' ios/App/App/Info.plist ios/App/App.xcodeproj/project.pbxproj
          grep -R 'neyqora' ios/App/App/Info.plist
      - name: Build iOS Simulator target
        run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
      - name: Package iOS Simulator app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/Build/Products/Debug-iphonesimulator/App.app build/ios/NEYQORA-iOS-Simulator.zip
      - name: Upload iOS Simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: neyqora-ios-simulator
          path: mobile/build/ios/NEYQORA-iOS-Simulator.zip
          if-no-files-found: error
      - name: Mobile config contract
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const pkg=JSON.parse(fs.readFileSync("package.json","utf8"));
          const cfg=fs.readFileSync("capacitor.config.ts","utf8");
          for (const token of ["com.neyqora.assistant","NEYQORA_APP_URL","cleartext: false","allowNavigation","PushNotifications","Keyboard"]) {
            if (!cfg.includes(token)) throw new Error("Missing mobile contract: "+token);
          }
          console.log("NEYQORA mobile config contract: PASS");
          NODE
