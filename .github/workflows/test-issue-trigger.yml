name: Issue Trigger Test

on:
  issues:
    types: [opened]

jobs:
  test:
    if: ${{ github.event.issue.user.login == 'perdeson359-design' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - name: Confirm issue trigger
        run: |
          echo "Issue trigger works."
          echo "Issue #${{ github.event.issue.number }}"
          echo "Title: ${{ github.event.issue.title }}"
