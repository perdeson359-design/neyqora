name: Test Projects

on:
  push:
    paths:
      - "projects/**"
  pull_request:
    paths:
      - "projects/**"

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run all Python project tests
        shell: bash
        run: |
          set -e
          test_files=$(find projects -type f -name 'test_*.py' | sort)
          if [ -z "$test_files" ]; then
            echo "No Python test files found."
            exit 0
          fi
          while IFS= read -r test_file; do
            echo "Running $test_file"
            python "$test_file"
          done <<< "$test_files"
