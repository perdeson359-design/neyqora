name: Mobile Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neyqora-mobile-release
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: mobile-release
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Require Android signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate and sync Android
        run: |
          npx cap add android
          npx cap sync android
      - name: Configure Android deep link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          if 'android:scheme="neyqora"' not in s:
              marker="</activity>"
              intent='''        <intent-filter>
                    <action android:name="android.intent.action.VIEW" />
                    <category android:name="android.intent.category.DEFAULT" />
                    <category android:name="android.intent.category.BROWSABLE" />
                    <data android:scheme="neyqora" android:host="open" />
                </intent-filter>
          '''
              p.write_text(s.replace(marker,intent+"\n    "+marker,1))
          PY
      - name: Configure Android signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_B64" | base64 --decode > android/neyqora-release.jks
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/build.gradle")
          s=p.read_text()
          signing='''\n    signingConfigs {
          release {
              storeFile file("neyqora-release.jks")
              storePassword System.getenv("KEYSTORE_PASSWORD")
              keyAlias System.getenv("KEY_ALIAS")
              keyPassword System.getenv("KEY_PASSWORD")
          }
      }
      '''
          if "storeFile file(\"neyqora-release.jks\")" not in s:
              s=s.replace("    buildTypes {", signing+"    buildTypes {",1)
          if "signingConfig signingConfigs.release" not in s:
              s=s.replace("release {\n","release {\n            signingConfig signingConfigs.release\n",1)
          p.write_text(s)
          PY
      - name: Build signed AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./android/gradlew -p android bundleRelease --no-daemon
      - name: Verify signed AAB
        run: |
          test -s android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify -verbose -certs android/app/build/outputs/bundle/release/app-release.aab >/dev/null
      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: neyqora-android-signed
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: rm -f android/neyqora-release.jks

  ios:
    runs-on: macos-latest
    timeout-minutes: 40
    environment: mobile-release
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package.json
      - name: Require Apple signing secrets
        env:
          P12_B64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for value in P12_B64 P12_PASSWORD PROFILE_B64 PROFILE_NAME TEAM_ID; do
            test -n "${!value}"
          done
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate and sync iOS
        run: |
          npx cap add ios
          npx cap sync ios
      - name: Configure iOS deep link
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          p=Path("ios/App/App/Info.plist")
          data=plistlib.loads(p.read_bytes())
          types=data.setdefault("CFBundleURLTypes", [])
          if not any("neyqora" in item.get("CFBundleURLSchemes", []) for item in types):
              types.append({"CFBundleURLName":"com.neyqora.assistant","CFBundleURLSchemes":["neyqora"]})
          p.write_bytes(plistlib.dumps(data, fmt=plistlib.FMT_XML))
          PY
      - name: Install Apple signing assets
        env:
          P12_B64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/neyqora-signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          echo "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/neyqora.mobileprovision"
          UUID=$(/usr/bin/security cms -D -i "$RUNNER_TEMP/neyqora.mobileprovision" | /usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin)
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/neyqora.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
      - name: Archive signed iOS app
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -archivePath "$RUNNER_TEMP/NEYQORA.xcarchive" -destination "generic/platform=iOS" DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" archive
      - name: Export signed IPA
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>teamID</key><string>$TEAM_ID</string>
          <key>signingStyle</key><string>manual</string>
          <key>provisioningProfiles</key><dict>
          <key>com.neyqora.assistant</key><string>$PROFILE_NAME</string>
          </dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/NEYQORA.xcarchive" -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
      - name: Verify signed IPA
        run: |
          test -s "$RUNNER_TEMP/export/App.ipa"
          unzip -q "$RUNNER_TEMP/export/App.ipa" -d "$RUNNER_TEMP/ipa-check"
          codesign --verify --deep --strict "$RUNNER_TEMP/ipa-check/Payload/App.app"
      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: neyqora-ios-signed
          path: /Users/runner/work/_temp/export/App.ipa
          if-no-files-found: error
