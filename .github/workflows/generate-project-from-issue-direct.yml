name: Generate Project From Issue Direct

on:
  issues:
    types: [opened, reopened]

jobs:
  generate:
    if: github.event.issue.author_association == 'OWNER' || github.event.issue.author_association == 'MEMBER' || github.event.issue.author_association == 'COLLABORATOR'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    env:
      NEYQORA_URL: https://neyqora.kosseofficial.workers.dev
      PROJECT_REQUEST: ${{ format('{0}\n\n{1}', github.event.issue.title, github.event.issue.body) }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Health
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/health.json -w "%{http_code}" -A "NEYQORA-GitHub-Actions" "$NEYQORA_URL/api/health")
          echo "Health HTTP=$code"
          cat /tmp/health.json
          test "$code" = "200"

      - name: Generate project
        id: generate
        run: |
          set -euo pipefail
          python -c 'import json,os; json.dump({"request":os.environ["PROJECT_REQUEST"]},open("/tmp/request.json","w",encoding="utf-8"),ensure_ascii=False)'
          session_code=$(curl -sS -o /tmp/session.json -w "%{http_code}" -c /tmp/neyqora.cookies -b /tmp/neyqora.cookies -A "NEYQORA-GitHub-Actions" "$NEYQORA_URL/api/session")
          echo "Session HTTP=$session_code"
          cat /tmp/session.json
          test "$session_code" = "200"
          python -c 'import json; d=json.load(open("/tmp/session.json")); assert d.get("ok") and isinstance(d.get("userId"),str), d'
          code=$(curl -sS -o /tmp/response.json -w "%{http_code}" -b /tmp/neyqora.cookies -c /tmp/neyqora.cookies -A "NEYQORA-GitHub-Actions" -H "Origin: https://neyqora.kosseofficial.workers.dev" -H "Content-Type: application/json" --data-binary @/tmp/request.json "$NEYQORA_URL/api/project" || true)
          echo "Project API HTTP=$code"
          cat /tmp/response.json || true
          python -c 'import json; d=json.load(open("/tmp/response.json")); assert d.get("ok") and d.get("files"), d'
          python -c 'import json,os,pathlib; d=json.load(open("/tmp/response.json")); root=pathlib.Path("projects")/("issue-"+os.environ["ISSUE_NUMBER"]); root.mkdir(parents=True,exist_ok=True); [(root/pathlib.Path(x["path"])).parent.mkdir(parents=True,exist_ok=True) or (root/pathlib.Path(x["path"])).write_text(x["content"],encoding="utf-8") for x in d["files"]]; print(root)'

      - name: Test
        id: test
        continue-on-error: true
        run: |
          set -euo pipefail
          files=$(find "projects/issue-$ISSUE_NUMBER" -type f -name 'test_*.py' | sort)
          test -n "$files"
          while IFS= read -r file; do timeout 30s python "$file"; done <<< "$files"

      - name: Syntax
        id: syntax
        continue-on-error: true
        run: |
          set -euo pipefail
          files=$(find "projects/issue-$ISSUE_NUMBER" -type f -name '*.py' | sort)
          while IFS= read -r file; do python -m py_compile "$file"; done <<< "$files"

      - name: Safety
        id: safety
        continue-on-error: true
        run: |
          set -euo pipefail
          ! grep -RInE '\\b(eval|exec)[[:space:]]*\\(' "projects/issue-$ISSUE_NUMBER" --include='*.py'
          ! grep -RInE '\\b(os\\.system|subprocess\\.(run|Popen|call|check_output|check_call)|socket\\.|ctypes\\.|pickle\\.loads|__import__)\\s*\\(' "projects/issue-$ISSUE_NUMBER" --include='*.py'
          ! grep -RInE '^\\s*(import|from)\\s+(subprocess|socket|ctypes|pickle)\\b' "projects/issue-$ISSUE_NUMBER" --include='*.py'

      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TEST: ${{ steps.test.outcome }}
          SYNTAX: ${{ steps.syntax.outcome }}
          SAFETY: ${{ steps.safety.outcome }}
        run: |
          if [ "$TEST" = "success" ] && [ "$SYNTAX" = "success" ] && [ "$SAFETY" = "success" ]; then status=passed; else status=failed; fi
          printf '%s\n' '<!-- NEYQORA_CI_RESULT {"status":"'"$status"'","tested":true,"run_id":"${{ github.run_id }}","sha":"${{ github.sha }}","first_test":"'"$TEST"'","final_gate":"'"$TEST"'"} -->' > /tmp/ci.md
          printf '%s\n' "NEYQORA CI sonucu: **$status**" "- Test: $TEST" "- Sözdizimi: $SYNTAX" "- Güvenlik: $SAFETY" >> /tmp/ci.md
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body-file /tmp/ci.md

      - name: Commit
        if: steps.test.outcome == 'success' && steps.syntax.outcome == 'success' && steps.safety.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name "NEYQORA"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find "projects/issue-$ISSUE_NUMBER" -type d -name __pycache__ -prune -exec rm -rf {} +
          find "projects/issue-$ISSUE_NUMBER" -type f -name '*.pyc' -delete
          git add "projects/issue-$ISSUE_NUMBER"
          git diff --cached --quiet && exit 0
          git commit -m "Generate and test project from issue"
          git push
